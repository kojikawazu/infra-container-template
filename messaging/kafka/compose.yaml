# Apache Kafka (KRaft・単一ノード) — 単独起動: docker compose -f messaging/kafka/compose.yaml up kafka
# ホストからは localhost:9092、コンテナ間からは kafka:19092 で接続する。
# 検証用にログは ephemeral（永続化なし）。必要なら KAFKA_LOG_DIRS + volume を追加する。
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: infra-kafka
    profiles: [kafka, messaging, all]
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092
      # ADVERTISED_LISTENERS は「クライアントが次に接続すべきアドレス」を broker が返す値。
      # クライアントは最初の接続後、ここで返されたアドレスへ繋ぎ直すため、
      # 接続元によって到達可能なアドレスが違う = リスナーを 2 系統に分ける必要がある。
      #   PLAINTEXT(9092) → ホスト PC から: localhost:9092
      #   INTERNAL(19092) → 同一ネットワークのコンテナから: kafka:19092
      # ⚠ ここを 1 系統にすると、片方の接続元から「接続はできるが直後にタイムアウトする」状態になる。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks: [infra-net]

networks:
  infra-net:
    name: infra-net
