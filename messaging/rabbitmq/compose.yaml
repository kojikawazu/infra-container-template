# RabbitMQ (管理UI内蔵) — 単独起動: docker compose -f messaging/rabbitmq/compose.yaml up rabbitmq
# AMQP: localhost:5672  /  管理UI: http://localhost:15672（既定 guest/guest ではなく .env の値）
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: infra-rabbitmq
    profiles: [rabbitmq, messaging, all]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-adminpass}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [infra-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  infra-net:
    name: infra-net

volumes:
  rabbitmq-data:
    name: infra-rabbitmq-data
