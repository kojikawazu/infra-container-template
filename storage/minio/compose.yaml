# MinIO (S3互換オブジェクトストレージ) — 単独起動: docker compose -f storage/minio/compose.yaml up minio
# API: http://localhost:9000  /  コンソール(UI): http://localhost:9001
services:
  minio:
    image: minio/minio:latest
    container_name: infra-minio
    profiles: [minio, storage, all]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [infra-net]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  infra-net:
    name: infra-net

volumes:
  minio-data:
    name: infra-minio-data
