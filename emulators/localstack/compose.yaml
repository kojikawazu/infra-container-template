# LocalStack (AWS エミュレータ・Community版/無料) — 単独起動: docker compose -f emulators/localstack/compose.yaml up localstack
# 統合エンドポイント: http://localhost:4566
# 例: aws --endpoint-url=http://localhost:4566 s3 ls
# docker.sock のマウントは Lambda 実行に必要。SERVICES で有効化するサービスを絞れる。
# ⚠ :latest (4系以降) は無料 Community でも LOCALSTACK_AUTH_TOKEN（無料登録トークン）が必須。
#    本テンプレはサインアップ不要で使えるよう 3 系にピン留めしている。
#    新機能が必要なら image を :latest にし .env で LOCALSTACK_AUTH_TOKEN を設定する。
services:
  localstack:
    image: localstack/localstack:3
    container_name: infra-localstack
    profiles: [localstack, emulator, all]
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: ${LOCALSTACK_SERVICES:-s3,sqs,sns,dynamodb,lambda}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [infra-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  infra-net:
    name: infra-net

volumes:
  localstack-data:
    name: infra-localstack-data
