# Redis — 単独起動: docker compose -f databases/redis/compose.yaml up redis
# requirepass で認証、appendonly で永続化
services:
  redis:
    image: redis:7-alpine
    container_name: infra-redis
    profiles: [redis, all]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redispass}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [infra-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  infra-net:
    name: infra-net

volumes:
  redis-data:
    name: infra-redis-data
