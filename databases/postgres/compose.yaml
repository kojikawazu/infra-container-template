# PostgreSQL — 単独起動: docker compose -f databases/postgres/compose.yaml up postgres
# initdb/ に置いた *.sql / *.sh は初回起動時に自動実行される
services:
  postgres:
    image: postgres:17
    container_name: infra-postgres
    profiles: [postgres, sql, all]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [infra-net]
    # healthcheck は「コンテナが起動した」と「接続できる」の差を埋める仕組み。
    # DB はプロセス起動後も初期化中は接続を受け付けないため、起動直後の接続は失敗しうる。
    # 判定結果は docker compose ps の STATUS（healthy / starting）に出る。
    # 依存サービス側で待ちたい場合は depends_on の condition と組み合わせる:
    #   depends_on:
    #     postgres:
    #       condition: service_healthy
    # （本テンプレは各サービスを独立に起動する方針のため、現状この待ち合わせは使っていない）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  infra-net:
    name: infra-net

volumes:
  postgres-data:
    name: infra-postgres-data
