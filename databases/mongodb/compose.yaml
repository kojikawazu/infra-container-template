# MongoDB — 単独起動: docker compose -f databases/mongodb/compose.yaml up mongodb
services:
  mongodb:
    image: mongo:7
    container_name: infra-mongodb
    profiles: [mongodb, nosql, all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-appdb}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks: [infra-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  infra-net:
    name: infra-net

volumes:
  mongodb-data:
    name: infra-mongodb-data
