# Adminer — MSSQL / MySQL / PostgreSQL を1画面で覗ける軽量Web UI
# http://localhost:8080  ログイン時に「サーバ」へ mysql / postgres / mssql（サービス名）を指定
services:
  adminer:
    image: adminer:latest
    container_name: infra-adminer
    profiles: [mysql, mariadb, postgres, mssql, sql, all]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-postgres}
    networks: [infra-net]
    restart: unless-stopped

networks:
  infra-net:
    name: infra-net
