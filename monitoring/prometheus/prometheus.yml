global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自身を監視
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 例: 他コンテナを監視する場合は exporter を足し、ここにターゲットを追加する。
  #   (各サービスは同一ネットワーク infra-net 上にあるためサービス名で解決できる)
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
