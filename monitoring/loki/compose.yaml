# Loki (ログ集約) — 単独起動: docker compose -f monitoring/loki/compose.yaml up loki
# http://localhost:3100  Grafana から「ログ」のデータソースとして参照する（自動登録済み）。
# 単一ノード構成では同梱の local-config.yaml で十分動く（追加設定不要）。
services:
  loki:
    image: grafana/loki:3.1.1
    container_name: infra-loki
    profiles: [loki, monitoring, all]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    networks: [infra-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  infra-net:
    name: infra-net

volumes:
  loki-data:
    name: infra-loki-data
