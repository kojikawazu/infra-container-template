# Tempo 最小構成（単一ノード・ローカルストレージ）。
# OTLP(gRPC/HTTP) を受信し、トレースをローカルディスクに保存する。学習・検証用途。
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h   # 検証用に保持は短め

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
